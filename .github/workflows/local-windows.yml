name: Local multiplatform release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Complete release version without v'
        required: true
      publish_release:
        description: 'Publish only after every platform and hash registration pass'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: torii-local-windows
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ShikkesoraSIM/torii-hiding' && github.actor == 'ShikkesoraSIM'
    runs-on: [self-hosted, Windows, X64, torii-windows-local]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          path: client
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ShikkesoraSIM/torii-framework
          ref: 25e68d530f7116437c4cfaf127169ac4d6619927
          path: torii-framework
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ShikkesoraSIM/torii-hiding
          ref: cb1648d8e6aeca89f2691d063d4591bb5c0963df
          path: toriirefresh-resources
          persist-credentials: false
      - name: Build and validate every platform
        env:
          TORII_LOCAL_DOTNET11: ${{ vars.TORII_LOCAL_DOTNET11 }}
          TORII_RELEASE_VERSION: ${{ inputs.version }}
          TORII_REGISTER_RELEASE: ${{ inputs.publish_release }}
          TORII_SERVER_URL: ${{ vars.TORII_SERVER_URL }}
          TORII_VERSION_WEBHOOK_SECRET: ${{ secrets.TORII_VERSION_WEBHOOK_SECRET }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./.github/scripts/local_release.ps1
      - name: Preserve release verification
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.version }}
          path: |
            release-files/SHA256SUMS.txt
            release-files/client-hashes.json
            release-files/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 7
      - name: Publish complete release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          repository: ShikkesoraSIM/torii
          token: ${{ secrets.TORII_PUBLIC_RELEASE_TOKEN }}
          tag_name: v${{ inputs.version }}
          target_commitish: master
          name: ${{ contains(inputs.version, '-nova') && 'Torii Nova ' || 'Torii ' }}v${{ inputs.version }}
          files: release-files/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(inputs.version, '-nova') }}
          body_path: release-files/RELEASE-NOTES.md
